<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="圖生圖範例：產品海報精修">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <style>
      .title { font: 700 40px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill: #0f172a; }
      .sub { font: 500 22px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill: #334155; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="120" y="120" width="1040" height="480" rx="30" fill="rgba(255,255,255,0.72)" stroke="#bfdbfe" stroke-width="3"/>
  <ellipse cx="460" cy="510" rx="180" ry="36" fill="#94a3b8" opacity="0.25"/>
  <rect x="360" y="300" width="220" height="180" rx="30" fill="#cbd5e1"/>
  <rect x="390" y="260" width="160" height="70" rx="20" fill="#94a3b8"/>
  <path d="M555 332 q50 -8 70 34 q-14 24 -52 20" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
  <rect x="720" y="220" width="340" height="70" rx="16" fill="#ffffff"/>
  <rect x="720" y="320" width="280" height="30" rx="10" fill="#ffffff"/>
  <rect x="720" y="370" width="250" height="30" rx="10" fill="#ffffff"/>
  <rect x="720" y="430" width="210" height="30" rx="10" fill="#ffffff"/>
  <text x="140" y="80" class="title">範例結果 C：圖生圖精修後的產品海報</text>
  <text x="140" y="660" class="sub">保留構圖，優化背景、邊緣清晰度與 CTA 留白區</text>
