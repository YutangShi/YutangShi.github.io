<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-label="生成式 AI、LLM、NFT 新手理解地圖">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5fbff"/>
      <stop offset="1" stop-color="#fff8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b1a33" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill: #0b1a33; }
      .sub { font: 500 18px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill: #3a4b66; }
      .card { fill: #fff; stroke: #d9e7ff; stroke-width: 2; filter: url(#shadow); }
      .h { font: 800 24px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill: #0b1a33; }
      .p { font: 500 16px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill: #456; }
      .arrow { stroke: #5f93ff; stroke-width: 6; fill: none; stroke-linecap: round; }
      .chip { font: 700 14px system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; fill: #1c5db9; }
    </style>
  </defs>
  <rect width="1400" height="760" rx="24" fill="url(#bg)"/>
  <text x="80" y="90" class="title">先分清楚三件事：生成式 AI、LLM、NFT</text>
  <text x="80" y="124" class="sub">它們不是同一個概念：前兩者是 AI 能力，後者是區塊鏈資產標準</text>

  <g transform="translate(120,190)">
    <rect class="card" rx="18" width="360" height="210"/>
    <text class="h" x="24" y="52">生成式 AI</text>
    <text class="p" x="24" y="86">會產生新內容的 AI 類型</text>
    <text class="p" x="24" y="114">可生成文字、圖片、音訊、程式碼</text>
    <text class="chip" x="24" y="160">範圍最大（上位概念）</text>
  </g>

  <g transform="translate(520,190)">
    <rect class="card" rx="18" width="360" height="210"/>
    <text class="h" x="24" y="52">LLM</text>
    <text class="p" x="24" y="86">大型語言模型，專注文字理解/生成</text>
    <text class="p" x="24" y="114">Chatbot、摘要、翻譯、寫作輔助</text>
    <text class="chip" x="24" y="160">生成式 AI 的一個子類</text>
  </g>

  <g transform="translate(920,190)">
    <rect class="card" rx="18" width="360" height="210"/>
    <text class="h" x="24" y="52">NFT</text>
    <text class="p" x="24" y="86">區塊鏈上的非同質化代幣</text>
    <text class="p" x="24" y="114">重點是「所有權與唯一識別」</text>
    <text class="chip" x="24" y="160">不是 AI 模型，也不是 LLM</text>
  </g>

  <path class="arrow" d="M480 295 L520 295"/>
  <path class="arrow" d="M520 295 L504 285 M520 295 L504 305"/>
  <path class="arrow" d="M880 295 L920 295"/>
  <path class="arrow" d="M920 295 L904 285 M920 295 L904 305"/>

  <g transform="translate(180,470)">
    <rect class="card" rx="18" width="1040" height="180"/>
    <text class="h" x="28" y="52">新手開始順序</text>
    <text class="p" x="28" y="88">1) 先學生成式 AI 與 Prompt 基礎</text>
    <text class="p" x="28" y="116">2) 再用 LLM 解決日常任務（摘要、整理、拆解）</text>
    <text class="p" x="28" y="144">3) 若你要做數位資產/會員憑證，再補 NFT 與 ERC-721</text>
  </g>
</svg>

