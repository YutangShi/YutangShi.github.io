<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">LLM-Wiki Hybrid 參考架構</title>
  <desc id="desc">使用者問題先由 Agent router 路由至 Wiki navigator；Navigator 可探索互連 Wiki pages，也可在證據不足或需要原文時呼叫 Raw-source RAG fallback。兩條路徑合併後由 citation validator 驗證來源與權限，再產生回答。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f5fffb"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0b1a33" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#735cff"/></marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#18a77a"/></marker>
    <style>
      .title{font:700 34px system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#0b1a33}.sub{font:500 17px system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#3a4b66}.label{font:800 20px system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#0b1a33}.desc{font:500 15px system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#3a4b66}.tiny{font:700 14px system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#3a4b66}.box{fill:#fff;stroke:#dfe7ff;stroke-width:2;filter:url(#shadow)}.wiki{stroke:#a7ead5}.rag{stroke:#b8c9ff}.valid{stroke:#f3c86a;fill:#fffaf0}.flow{fill:none;stroke:#735cff;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow)}.wiki-flow{fill:none;stroke:#18a77a;stroke-width:4;stroke-linecap:round;marker-end:url(#green-arrow)}
    </style>
  </defs>
  <rect width="1200" height="760" rx="26" fill="url(#bg)"/>
  <text x="60" y="68" class="title">LLM-Wiki Hybrid：以導覽為主、原始來源檢索為後援</text>
  <text x="60" y="100" class="sub">同一個 Agent 可組合 Wiki 導覽與 Raw-source RAG fallback，確保回答兼具脈絡、覆蓋率與可驗證性。</text>
  <g transform="translate(65 315)"><rect class="box" width="160" height="105" rx="18"/><text x="22" y="43" class="label">使用者問題</text><text x="22" y="70" class="desc">問題、角色、情境</text></g>
  <path class="flow" d="M225 367H280"/>
  <g transform="translate(300 285)"><rect class="box" width="205" height="165" rx="18"/><text x="22" y="44" class="label">Agent router</text><text x="22" y="73" class="desc">判斷任務與風險</text><text x="22" y="99" class="desc">套用 ACL filter</text><text x="22" y="125" class="desc">選擇導覽 / fallback</text></g>
  <path class="wiki-flow" d="M505 330H575"/>
  <g transform="translate(595 205)"><rect class="box wiki" width="245" height="122" rx="18"/><text x="22" y="43" class="label">Wiki navigator</text><text x="22" y="70" class="desc">search → read → follow links</text><text x="22" y="95" class="desc">建立可解釋的知識路徑</text></g>
  <path class="wiki-flow" d="M840 266H860"/>
  <g transform="translate(860 145)"><rect class="box wiki" width="255" height="242" rx="18"/><text x="22" y="43" class="label">Wiki pages</text><text x="22" y="74" class="desc">• 主題頁與關係連結</text><text x="22" y="104" class="desc">• 版本與 provenance</text><text x="22" y="134" class="desc">• ACL 可見性</text><path d="M53 168H190M53 168L76 151M53 168L76 185M202 191H65M202 191L179 174M202 191L179 208" fill="none" stroke="#18a77a" stroke-width="3" stroke-linecap="round"/><text x="22" y="220" class="desc">互連導覽，不只 top-k 片段</text></g>
  <path class="flow" d="M505 403H575"/>
  <g transform="translate(595 450)"><rect class="box rag" width="245" height="130" rx="18"/><text x="22" y="43" class="label">Raw-source RAG fallback</text><text x="22" y="70" class="desc">原文切塊、檢索與重排序</text><text x="22" y="95" class="desc">處理新資料、缺頁或精確引文</text></g>
  <path class="flow" d="M840 515H912"/>
  <g transform="translate(912 418)"><rect class="box valid" width="210" height="184" rx="18"/><text x="20" y="43" class="label">citation validator</text><text x="20" y="73" class="desc">驗證主張 ↔ 來源</text><text x="20" y="99" class="desc">確認 ACL 與版本</text><text x="20" y="125" class="desc">不足則要求回查</text><text x="20" y="155" class="tiny">合併 Wiki + RAG 證據</text></g>
  <path class="flow" d="M1017 602V670"/>
  <g transform="translate(60 670)"><rect class="box" width="1060" height="55" rx="16"/><text x="22" y="34" class="label">回答：附可追溯引用、導覽脈絡與原始來源連結；高風險答案可送 human review gate。</text></g>
  <path d="M840 262C885 262 882 455 912 480" fill="none" stroke="#18a77a" stroke-width="3" stroke-dasharray="7 8" marker-end="url(#green-arrow)"/>
  <text x="735" y="420" class="tiny">證據不足／需原文時切換 fallback</text>
</svg>
