<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Chunk-based RAG 與 LLM-Wiki 生命週期比較</title>
  <desc id="desc">左側為常見 chunk-based RAG：原始文件經切塊、嵌入與建立索引後，查詢會取回前幾名內容並放入提示詞生成答案。右側為 LLM-Wiki：原始來源被萃取與編譯為含來源證據的互連 Wiki，Agent 導覽、閱讀並追蹤連結，再由人工覆核與錯誤回饋更新 Wiki。兩側均標示 ACL 權限過濾與回查原始來源。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f5fffb"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0b1a33" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#735cff"/></marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#18a77a"/></marker>
    <style>
      .title { font: 700 34px system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; fill:#0b1a33; }
      .sub { font: 500 17px system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; fill:#3a4b66; }
      .section { font: 800 24px system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; fill:#0b1a33; }
      .label { font: 800 17px system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; fill:#0b1a33; }
      .small { font: 500 14px system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; fill:#3a4b66; }
      .tiny { font: 600 13px system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; fill:#3a4b66; }
      .box { fill:#fff; stroke:#dfe7ff; stroke-width:2; filter:url(#shadow); }
      .rag { stroke:#b8c9ff; } .wiki { stroke:#a7ead5; } .gate { stroke:#f6c86f; fill:#fffaf0; }
      .flow { fill:none; stroke:#735cff; stroke-width:4; stroke-linecap:round; marker-end:url(#arrow); }
      .wiki-flow { fill:none; stroke:#18a77a; stroke-width:4; stroke-linecap:round; marker-end:url(#green-arrow); }
      .note { fill:#edf1ff; stroke:#cbd5ff; stroke-width:1.5; } .note-green { fill:#eafff6; stroke:#a7ead5; stroke-width:1.5; }
    </style>
  </defs>
  <rect width="1200" height="860" rx="26" fill="url(#bg)"/>
  <text x="60" y="68" class="title">Chunk-based RAG 與 LLM-Wiki：知識生命週期的差異</text>
  <text x="60" y="100" class="sub">RAG 以片段檢索為核心；LLM-Wiki 將知識、連結與來源證據維護成可持續更新的工作流。</text>

  <g aria-label="常見 chunk-based RAG 流程">
    <rect x="55" y="135" width="500" height="590" rx="22" fill="#f9fbff" stroke="#cad6ff" stroke-width="2"/>
    <text x="85" y="180" class="section">常見 chunk-based RAG</text>
    <text x="85" y="207" class="small">查詢時從索引挑出最相關的片段</text>
    <g transform="translate(85 240)"><rect class="box rag" width="195" height="80" rx="14"/><text x="18" y="34" class="label">Raw documents</text><text x="18" y="59" class="small">PDF、文件、資料表</text></g>
    <path class="flow" d="M280 280H325"/>
    <g transform="translate(345 240)"><rect class="box rag" width="175" height="80" rx="14"/><text x="17" y="34" class="label">chunk / embed</text><text x="17" y="59" class="small">切塊、向量化、建索引</text></g>
    <path class="flow" d="M432 320V365"/>
    <g transform="translate(285 385)"><rect class="box rag" width="145" height="72" rx="14"/><text x="18" y="31" class="label">Query</text><text x="18" y="54" class="small">使用者問題</text></g>
    <path class="flow" d="M357 457V475"/>
    <g transform="translate(85 493)"><rect class="box rag" width="190" height="78" rx="14"/><text x="18" y="34" class="label">retrieve top-k</text><text x="18" y="59" class="small">取回相關 chunks</text></g>
    <path class="flow" d="M275 532H315"/>
    <g transform="translate(335 493)"><rect class="box rag" width="125" height="78" rx="14"/><text x="18" y="34" class="label">Prompt</text><text x="18" y="59" class="small">問題 + 片段</text></g>
    <path class="flow" d="M460 532H492"/>
    <g transform="translate(85 616)"><rect class="box rag" width="375" height="74" rx="14"/><text x="18" y="33" class="label">Answer</text><text x="18" y="57" class="small">可附引用，但仍需回查來源確認語境</text></g>
    <rect class="note" x="85" y="745" width="410" height="55" rx="13"/><text x="103" y="769" class="tiny">進階 RAG 亦可 hybrid／結構化／agentic</text><text x="103" y="789" class="small">ACL filter：索引與檢索時均依使用者權限過濾</text>
  </g>

  <g aria-label="LLM-Wiki 流程">
    <rect x="645" y="135" width="500" height="670" rx="22" fill="#f7fffc" stroke="#a7ead5" stroke-width="2"/>
    <text x="675" y="180" class="section">LLM-Wiki</text>
    <text x="675" y="207" class="small">將可讀知識、關係與可驗證證據一併營運</text>
    <g transform="translate(675 240)"><rect class="box wiki" width="180" height="76" rx="14"/><text x="17" y="33" class="label">Raw sources</text><text x="17" y="57" class="small">文件、規範、系統記錄</text></g>
    <path class="wiki-flow" d="M855 278H895"/>
    <g transform="translate(915 240)"><rect class="box wiki" width="190" height="76" rx="14"/><text x="17" y="33" class="label">extract / compile</text><text x="17" y="57" class="small">擷取、整理、編譯</text></g>
    <path class="wiki-flow" d="M1010 316V350"/>
    <g transform="translate(735 375)"><rect class="box wiki" width="310" height="88" rx="14"/><text x="18" y="35" class="label">linked wiki + provenance</text><text x="18" y="61" class="small">互連 Wiki 頁面 + 每項主張的來源證據</text></g>
    <rect class="note-green" x="675" y="483" width="160" height="50" rx="13"/><text x="691" y="513" class="tiny">ACL filter</text><text x="691" y="529" class="small">依角色顯示頁面</text>
    <path class="wiki-flow" d="M890 463V550"/>
    <g transform="translate(855 550)"><rect class="box wiki" width="250" height="84" rx="14"/><text x="18" y="34" class="label">agent search / read</text><text x="18" y="57" class="small">搜尋、閱讀、追蹤連結</text><text x="18" y="76" class="small">必要時回查原始來源</text></g>
    <path class="wiki-flow" d="M980 634V660H752V690"/>
    <g transform="translate(675 690)"><rect class="box wiki" width="155" height="72" rx="14"/><text x="18" y="31" class="label">Answer</text><text x="18" y="54" class="small">附來源脈絡</text></g>
    <path class="wiki-flow" d="M830 726H895"/>
    <g transform="translate(895 690)"><rect class="box gate" width="210" height="72" rx="14"/><text x="18" y="31" class="label">human review gate</text><text x="18" y="54" class="small">高風險內容先覆核</text></g>
    <path class="wiki-flow" d="M1000 762V790H720V463"/>
    <text x="730" y="783" class="tiny">review / error feedback → wiki update</text>
  </g>
</svg>
